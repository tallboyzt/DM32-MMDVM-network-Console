<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMDVM 控制台</title>
<style>
:root{--bg:#0f1216;--card:#171b22;--card2:#1e242e;--txt:#e6e9ee;--dim:#8a94a3;--acc:#5b8cff;--acc2:#7aa2ff;--ok:#3ddc84;--warn:#ffb454;--bad:#ff5c6c;--line:#262d38}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px}
h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--dim);font-size:12px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:16px;font-weight:600;margin-top:3px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.hotspot{background:rgba(61,220,132,.12);color:var(--ok)}
.badge.network{background:rgba(91,140,255,.15);color:var(--acc2)}
.badge.unknown{background:rgba(255,180,84,.12);color:var(--warn)}
.badge.red{background:rgba(255,92,108,.12);color:var(--bad)}
.badge.green{background:rgba(61,220,132,.12);color:var(--ok)}
.b-switch{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
.b-switch:hover{background:var(--acc2)}
.b-switch.purple{background:#7c5cff}
.b-switch.purple:hover{background:#937bff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase}
pre{background:#0c0f13;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;max-height:260px;white-space:pre-wrap}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;width:100%}
label{color:var(--dim);font-size:12px;display:block;margin:6px 0 3px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.col{flex:1;min-width:140px}
iframe{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;height:calc(100vh - 215px)}
.nethead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note{background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.3);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--warn)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#20262f;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13px;z-index:99;max-width:90vw;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.hidden{display:none!important}
a{color:var(--acc2)}
</style>
</head>
<body>

<div class="card">
  <h1>MMDVM 控制台 <span class="sub" id="t-sub"></span>
    <span class="badge unknown" id="t-mode">未知</span>
    <button class="b-switch purple" id="b-switch" onclick="switchMode()">切换模式</button>
  </h1>
  <div class="sub" id="t-pw" style="margin-top:6px"></div>
</div>

<div id="pw-card" class="card hidden">
  <b>设置管理员密码（macOS，输入一次）</b>
  <div class="sub" style="margin:4px 0 8px">切换网络模式时需要管理员权限，密码仅存本机钥匙串（Keychain），不会上传。</div>
  <div class="bar">
    <div class="col"><input type="password" id="pw-input" placeholder="Mac 登录密码"></div>
    <button class="b-switch" onclick="setPw()">保存</button>
  </div>
</div>

<div id="cfg-card" class="card hidden">
  <b>需要先配置</b>
  <div class="sub" style="margin-top:4px">请编辑配置文件 <code id="cfg-path"></code>，填写 MMDVMHost / DMRGateway 路径、DMR ID、呼号、频率后刷新本页。</div>
</div>

<div id="mmdvm-view">
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <b>状态</b>
      <div class="row">
        <button class="b-switch" onclick="api('/api/start',{})">启动</button>
        <button class="b-switch" onclick="api('/api/stop',{})">停止</button>
        <button class="b-switch" onclick="api('/api/restart',{})">重启</button>
      </div>
    </div>
    <div class="grid">
      <div class="stat"><div class="k">模式</div><div class="v" id="s-mode">-</div></div>
      <div class="stat"><div class="k">DMRGateway</div><div class="v" id="s-dg">-</div></div>
      <div class="stat"><div class="k">MMDVMHost</div><div class="v" id="s-mh">-</div></div>
      <div class="stat"><div class="k">呼号</div><div class="v" id="s-call">-</div></div>
      <div class="stat"><div class="k">频率</div><div class="v" id="s-freq">-</div></div>
      <div class="stat"><div class="k">DMR ID</div><div class="v" id="s-id">-</div></div>
    </div>
  </div>

  <div class="card">
    <b>最近通联 (QSO)</b>
    <div style="margin-top:8px;overflow:auto;max-height:220px">
      <table><thead><tr><th>时间</th><th>源</th><th>目标</th><th>时隙</th><th>RSSI</th></tr></thead>
      <tbody id="qso-body"><tr><td colspan="5" class="sub">暂无</td></tr></tbody></table>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <b>MMDVM 日志</b>
      <pre id="log-mm">-</pre>
    </div>
    <div class="card">
      <b>DMRGateway 日志</b>
      <pre id="log-dg">-</pre>
    </div>
  </div>
</div>

<div id="net-view" class="hidden">
  <div class="card nethead">
    <b>网络模式 · 电台控制面板</b>
    <button class="b-switch" onclick="switchMode()">切换回热点</button>
  </div>
  <iframe id="net-frame" src="about:blank"></iframe>
</div>

<div id="toast" class="toast hidden"></div>

<script>
let curView = null;
let radioIP = "";

async function api(path, body) {
  const opt = { method: path.startsWith("/api/") && (path.includes("switch") || path.includes("start") || path.includes("stop") || path.includes("restart") || path.includes("config") || path.includes("password")) ? "POST" : "GET" };
  if (body !== undefined) {
    opt.method = "POST";
    opt.headers = { "Content-Type": "application/json" };
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(path, opt);
  return r.json();
}

function toast(msg, ms = 3000) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.add("hidden"), ms);
}

function badge(mode) {
  const map = { hotspot: "热点", network: "网络", unknown: "未知" };
  return { text: map[mode] || mode, cls: mode };
}

function applyMode(mode) {
  const mv = document.getElementById("mmdvm-view");
  const nv = document.getElementById("net-view");
  const tm = document.getElementById("t-mode");
  const b = badge(mode);
  tm.textContent = b.text;
  tm.className = "badge " + b.cls;
  document.getElementById("b-switch").textContent = (mode === "network") ? "切换回热点" : "切换到网络";
  if (mode === "network") {
    mv.classList.add("hidden");
    nv.classList.remove("hidden");
    if (curView !== "net") {
      curView = "net";
      document.getElementById("net-frame").src = "http://" + radioIP + "/";
    }
  } else {
    nv.classList.add("hidden");
    mv.classList.remove("hidden");
    curView = "mmdvm";
  }
}

async function loadStatus() {
  try {
    const s = await api("/api/status");
    applyMode(s.mode);
    document.getElementById("s-mode").textContent = badge(s.mode).text;
    document.getElementById("s-dg").textContent = s.running.dmrgateway ? "运行" : "停止";
    document.getElementById("s-mh").textContent = s.running.mmdvmhost ? "运行" : "停止";
    document.getElementById("s-call").textContent = s.info.callsign || "-";
    document.getElementById("s-freq").textContent = s.info.frequency || "-";
    document.getElementById("s-id").textContent = s.info.dmr_id || "-";
    document.getElementById("log-mm").textContent = s.mmdvm_log || "-";
    document.getElementById("log-dg").textContent = s.dmrgateway_log || "-";
    const qb = document.getElementById("qso-body");
    if (s.qsos && s.qsos.length) {
      qb.innerHTML = s.qsos.map(q => "<tr><td>" + q.t + "</td><td>" + q.src + "</td><td>" + q.dst + "</td><td>" + q.ts + "</td><td>" + q.rssi + "</td></tr>").join("");
    } else {
      qb.innerHTML = '<tr><td colspan="5" class="sub">暂无</td></tr>';
    }
  } catch (e) {}
}

async function loadInfo() {
  try {
    const i = await api("/api/info");
    radioIP = i.radio_ip || "";
    document.getElementById("t-sub").textContent = (i.callsign || "") + " " + (i.frequency_mhz || "");
    const pw = document.getElementById("pw-card");
    if (!i.password_set) {
      pw.classList.remove("hidden");
      document.getElementById("t-pw").textContent = "⚠ 尚未设置管理员密码";
    } else {
      pw.classList.add("hidden");
      document.getElementById("t-pw").textContent = "";
    }
    const cfgc = document.getElementById("cfg-card");
    if (!i.configured) {
      cfgc.classList.remove("hidden");
      document.getElementById("cfg-path").textContent = "config.json";
    } else {
      cfgc.classList.add("hidden");
    }
  } catch (e) {}
}

async function switchMode() {
  const b = document.getElementById("b-switch");
  b.disabled = true;
  b.textContent = "切换中...";
  try {
    const d = await api("/api/switch", {});
    applyMode(d.mode);
    toast((d.mode === "network" ? "已切换到网络模式" : "已切换到热点模式") + (d.ppp ? "" : " ⚠ " + (d.ppp_out || "")));
    setTimeout(loadStatus, 1200);
  } catch (e) {
    toast("切换失败: " + e);
  }
  b.disabled = false;
  b.textContent = "切换模式";
}

async function setPw() {
  const v = document.getElementById("pw-input").value;
  if (!v) { toast("请输入密码"); return; }
  const d = await api("/api/password", { password: v });
  if (d.ok) {
    toast("密码已保存（本机钥匙串）");
    document.getElementById("pw-input").value = "";
    loadInfo();
  } else {
    toast("保存失败");
  }
}

loadInfo();
loadStatus();
setInterval(loadStatus, 3000);
</script>
</body>
</html>
